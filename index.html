<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Robot Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 20px;
      user-select: none;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 15px;
      margin: 15px auto;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    input[type="text"], input[type="number"] {
      padding: 8px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      text-align: center;
    }
    input[type="number"] { width: 60px; }
    #joystick-container {
      position: relative;
      width: 220px;
      height: 220px;
      background: #2a2a2a;
      border-radius: 50%;
      margin: 15px auto;
      touch-action: none;
      border: 3px solid #444;
    }
    #joystick-knob {
      position: absolute;
      width: 50px;
      height: 50px;
      background: #007bff;
      border-radius: 50%;
      top: 85px;
      left: 85px;
      box-shadow: 0 0 8px rgba(0,0,0,0.6);
    }
    .servo-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 8px;
    }
    .servo-control label { font-weight: bold; width: 70px; text-align: left; }
    .servo-control input[type="range"] { flex-grow: 1; margin: 0 10px; }
  </style>
</head>
<body>

  <h2>Robot Controller</h2>

  <div class="card">
    <label for="host">ESP32 Host/IP:</label><br><br>
    <input type="text" id="host" value="esp32-servos.local">
  </div>

  <div class="card">
    <h3>2D Joystick (Servo 0 & 1)</h3>
    <div id="joystick-container">
      <div id="joystick-knob"></div>
    </div>
  </div>

  <div class="card">
    <h3>Feineinstellung</h3>
    
    <div class="servo-control">
      <label>Servo 0</label>
      <input type="range" id="slider0" min="0" max="180" value="90" oninput="updateFromSlider(0, this.value)">
      <input type="number" id="num0" min="0" max="180" value="90" onchange="updateFromNum(0, this.value)"> °
    </div>

    <div class="servo-control">
      <label>Servo 1</label>
      <input type="range" id="slider1" min="0" max="180" value="90" oninput="updateFromSlider(1, this.value)">
      <input type="number" id="num1" min="0" max="180" value="90" onchange="updateFromNum(1, this.value)"> °
    </div>
  </div>

  <script>
    const container = document.getElementById('joystick-container');
    const knob = document.getElementById('joystick-knob');
    let isDragging = false;
    let lastSendTime = 0;

    const maxRadius = 85; 
    const centerX = 110;  
    const centerY = 110;  

    container.addEventListener('mousedown', startDrag);
    document.addEventListener('mousemove', moveDrag);
    document.addEventListener('mouseup', endDrag);

    container.addEventListener('touchstart', startDrag);
    document.addEventListener('touchmove', moveDrag);
    document.addEventListener('touchend', endDrag);

    function startDrag(e) { isDragging = true; moveDrag(e); }

    function moveDrag(e) {
      if (!isDragging) return;

      const rect = container.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let dx = clientX - rect.left - centerX;
      let dy = clientY - rect.top - centerY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
      }

      knob.style.left = `${centerX + dx - 25}px`;
      knob.style.top = `${centerY + dy - 25}px`;

      let angleX = Math.round(((dx + maxRadius) / (2 * maxRadius)) * 180);
      let angleY = Math.round(((-dy + maxRadius) / (2 * maxRadius)) * 180);

      syncUI(0, angleX);
      syncUI(1, angleY);

      const now = Date.now();
      if (now - lastSendTime > 50) { 
        sendServoData(0, angleX);
        sendServoData(1, angleY);
        lastSendTime = now;
      }
    }

    function endDrag() { isDragging = false; }

    function updateFromSlider(servoNum, value) {
      value = Math.min(180, Math.max(0, parseInt(value) || 0));
      document.getElementById(`num${servoNum}`).value = value;
      sendServoData(servoNum, value);
    }

    function updateFromNum(servoNum, value) {
      value = Math.min(180, Math.max(0, parseInt(value) || 0));
      document.getElementById(`slider${servoNum}`).value = value;
      document.getElementById(`num${servoNum}`).value = value;
      sendServoData(servoNum, value);
    }

    function syncUI(servoNum, value) {
      document.getElementById(`slider${servoNum}`).value = value;
      document.getElementById(`num${servoNum}`).value = value;
    }

    function sendServoData(num, angle) {
      const host = document.getElementById('host').value;
      if (!host) return;

      fetch(`http://${host}/setServo?num=${num}&angle=${angle}`, { mode: 'no-cors' })
        .catch(err => console.error("Fehler:", err));
    }
  </script>
</body>
</html>
