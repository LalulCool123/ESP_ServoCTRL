<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeskAI Servo</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 560px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        label,
        input,
        button {
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        input {
            margin: .5rem 0 1rem;
        }

        button {
            padding: .7rem;
            margin: .4rem 0;
            cursor: pointer;
        }

        output {
            display: block;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <h1>PCA9685 Servo</h1>
    <label for="channel">Kanal (0-15)</label>
    <input id="channel" type="number" min="0" max="15" value="0">
    <label for="angle">Winkel: <output id="angleValue">90</output>&deg;</label>
    <input id="angle" type="range" min="0" max="180" value="90">
    <button id="send">Servo bewegen</button>
    <output id="status">Bereit</output>
    <script>
        const channel = document.querySelector('#channel');
        const angle = document.querySelector('#angle');
        const angleValue = document.querySelector('#angleValue');
        const status = document.querySelector('#status');
        angle.addEventListener('input', () => { angleValue.value = angle.value; });
        document.querySelector('#send').addEventListener('click', async () => {
            status.textContent = 'Sende...';
            const response = await fetch(`/api/servo?channel=${channel.value}&angle=${angle.value}`);
            const result = await response.json();
            status.textContent = response.ok ? `Kanal ${result.channel}: ${result.angle} Grad` : result.error;
        });
    </script>
</body>

</html>
