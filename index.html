<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Robot Controller & Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 20px;
      user-select: none;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 15px;
      margin: 15px auto;
      max-width: 420px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    input[type="text"], input[type="number"] {
      padding: 10px;
      font-size: 15px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      text-align: center;
    }
    input[type="number"] { width: 60px; }
    
    /* Chat Styling */
    #chat-box {
      height: 180px;
      overflow-y: auto;
      background: #2a2a2a;
      border-radius: 8px;
      padding: 10px;
      text-align: left;
      margin-bottom: 10px;
      border: 1px solid #444;
    }
    .msg {
      margin: 5px 0;
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .user-msg {
      background: #007bff;
      color: white;
      margin-left: auto;
    }
    .bot-msg {
      background: #3a3a3a;
      color: white;
      margin-right: auto;
    }
    .chat-input-container {
      display: flex;
      gap: 10px;
    }
    .chat-input-container input {
      flex-grow: 1;
      text-align: left;
    }
    button {
      padding: 10px 16px;
      font-size: 15px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #218838; }

    /* Joystick Styling */
    #joystick-container {
      position: relative;
      width: 200px;
      height: 200px;
      background: #2a2a2a;
      border-radius: 50%;
      margin: 15px auto;
      touch-action: none;
      border: 3px solid #444;
    }
    #joystick-knob {
      position: absolute;
      width: 45px;
      height: 45px;
      background: #007bff;
      border-radius: 50%;
      top: 77px;
      left: 77px;
      box-shadow: 0 0 8px rgba(0,0,0,0.6);
    }
    .servo-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0;
      background: #2a2a2a;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .servo-control label { font-weight: bold; width: 70px; text-align: left; }
    .servo-control input[type="range"] { flex-grow: 1; margin: 0 10px; }
  </style>
</head>
<body>

  <h2>Robot Dashboard</h2>

  <!-- Verbindung & Hosts -->
  <div class="card">
    <label>Servo ESP32 Host:</label><br>
    <input type="text" id="hostServo" value="esp32-servos.local" style="width: 80%; margin-top: 5px;"><br><br>
    <label>Display ESP32 Host:</label><br>
    <input type="text" id="hostDisplay" value="esp32-display.local" style="width: 80%; margin-top: 5px;">
  </div>

  <!-- Chat / Text I/O -->
  <div class="card">
    <h3>Gemini Chat</h3>
    <div id="chat-box"></div>
    <div class="chat-input-container">
      <input type="text" id="chatInput" placeholder="Sende eine Nachricht..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">Senden</button>
    </div>
  </div>

  <!-- 2D Joystick -->
  <div class="card">
    <h3>2D Joystick</h3>
    <div id="joystick-container">
      <div id="joystick-knob"></div>
    </div>
  </div>

  <!-- Servo Feineinstellung -->
  <div class="card">
    <h3>Servo Einstellungen</h3>
    
    <div class="servo-control">
      <label>Servo 0</label>
      <input type="range" id="slider0" min="0" max="180" value="90" oninput="updateFromSlider(0, this.value)">
      <input type="number" id="num0" min="0" max="180" value="90" onchange="updateFromNum(0, this.value)"> °
    </div>

    <div class="servo-control">
      <label>Servo 1</label>
      <input type="range" id="slider1" min="0" max="180" value="90" oninput="updateFromSlider(1, this.value)">
      <input type="number" id="num1" min="0" max="180" value="90" onchange="updateFromNum(1, this.value)"> °
    </div>
  </div>

  <script>
    // --- Chat Logik ---
    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      const hostDisplay = document.getElementById('hostDisplay').value;

      if (!text) return;

      appendMessage(text, 'user-msg');
      input.value = '';

      // Sende den Text an den Display-ESP32
      fetch(`http://${hostDisplay}/chat?prompt=${encodeURIComponent(text)}`)
        .then(res => res.json())
        .then(data => {
          if (data.text) {
            appendMessage(`[${data.emotion || 'happy'}] ${data.text}`, 'bot-msg');
          }
        })
        .catch(err => {
          console.error("Fehler beim Chatten:", err);
          appendMessage("Fehler: Keine Antwort vom Display-ESP32 erhalten.", 'bot-msg');
        });
    }

    function appendMessage(text, className) {
      const chatBox = document.getElementById('chat-box');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${className}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- Joystick & Servo Logik ---
    const container = document.getElementById('joystick-container');
    const knob = document.getElementById('joystick-knob');
    let isDragging = false;
    let lastSendTime = 0;

    const maxRadius = 77; 
    const centerX = 100;  
    const centerY = 100;  

    container.addEventListener('mousedown', startDrag);
    document.addEventListener('mousemove', moveDrag);
    document.addEventListener('mouseup', endDrag);

    container.addEventListener('touchstart', startDrag);
    document.addEventListener('touchmove', moveDrag);
    document.addEventListener('touchend', endDrag);

    function startDrag(e) { isDragging = true; moveDrag(e); }

    function moveDrag(e) {
      if (!isDragging) return;

      const rect = container.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let dx = clientX - rect.left - centerX;
      let dy = clientY - rect.top - centerY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
      }

      knob.style.left = `${centerX + dx - 22}px`;
      knob.style.top = `${centerY + dy - 22}px`;

      let angleX = Math.round(((dx + maxRadius) / (2 * maxRadius)) * 180);
      let angleY = Math.round(((-dy + maxRadius) / (2 * maxRadius)) * 180);

      syncUI(0, angleX);
      syncUI(1, angleY);

      const now = Date.now();
      if (now - lastSendTime > 50) { 
        sendServoData(0, angleX);
        sendServoData(1, angleY);
        lastSendTime = now;
      }
    }

    function endDrag() { isDragging = false; }

    function updateFromSlider(servoNum, value) {
      value = Math.min(180, Math.max(0, parseInt(value) || 0));
      document.getElementById(`num${servoNum}`).value = value;
      sendServoData(servoNum, value);
    }

    function updateFromNum(servoNum, value) {
      value = Math.min(180, Math.max(0, parseInt(value) || 0));
      document.getElementById(`slider${servoNum}`).value = value;
      document.getElementById(`num${servoNum}`).value = value;
      sendServoData(servoNum, value);
    }

    function syncUI(servoNum, value) {
      document.getElementById(`slider${servoNum}`).value = value;
      document.getElementById(`num${servoNum}`).value = value;
    }

    function sendServoData(num, angle) {
      const host = document.getElementById('hostServo').value;
      if (!host) return;

      fetch(`http://${host}/setServo?num=${num}&angle=${angle}`, { mode: 'no-cors' })
        .catch(err => console.error("Servo-Fehler:", err));
    }
  </script>
</body>
</html>
