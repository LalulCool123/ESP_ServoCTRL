<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Servo Steuerung</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
    .control { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; }
    input[type=range] { width: 100%; }
  </style>
</head>
<body>
  <h2>Servo Steuerung</h2>
  
  <div class="control">
    <label for="ip">ESP32 IP-Adresse:</label>
    <input type="text" id="ip" placeholder="z.B. 192.168.1.50">
  </div>

  <div class="control">
    <label for="servo0">Servo 0 Angle: <span id="val0">90</span>°</label>
    <input type="range" id="servo0" min="0" max="180" value="90" oninput="sendServo(0, this.value)">
  </div>

  <script>
    function sendServo(num, angle) {
      document.getElementById('val' + num).innerText = angle;
      const ip = document.getElementById('ip').value;
      if (!ip) return;
      
      fetch(`http://${ip}/setServo?num=${num}&angle=${angle}`)
        .catch(err => console.error("Fehler beim Senden:", err));
    }
  </script>
</body>
</html>
